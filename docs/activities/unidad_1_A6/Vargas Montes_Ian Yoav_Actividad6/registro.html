<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Suscripción</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <main class="card">
      <header class="card__header">
        <h1>Crear una cuenta</h1>
        <p>Completa el formulario para suscribirte al boletín.</p>
      </header>

      <form id="formulario" action="#" method="post" novalidate>

        <div class="form__group">
          <label for="nombre">
            Nombre completo <span class="required">*</span>
          </label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ej. María González"
            required
          />
        </div>

        <div class="form__group">
          <label for="email">
            Correo electrónico <span class="required">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            required
          />
        </div>

        <div class="form__group">
          <label for="password">
            Contraseña <span class="required">*</span>
          </label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 8 caracteres"
            required
          />
        </div>
      <div class="form__group"> 
        <fieldset> <legend>Frecuencia del boletín</legend> 
          <div class="form__radio-group"> 
            <label> <input type="radio" id="frecuencia-diaria" name="frecuencia" value="diaria" /> Diaria </label> 
            <label> <input type="radio" id="frecuencia-semanal" name="frecuencia" value="semanal" checked /> Semanal </label> 
            <label> <input type="radio" id="frecuencia-mensual" name="frecuencia" value="mensual" /> Mensual </label> 
          </div>
         </fieldset> 
        </div>

        <div class="form__group">
          <label for="pais">País de residencia</label>
          <select id="pais" name="pais">
            <option value="">— Selecciona tu país —</option>
            <option value="MX">México</option>
            <option value="ES">España</option>
            <option value="AR">Argentina</option>
            <option value="CO">Colombia</option>
            <option value="CL">Chile</option>
            <option value="PE">Perú</option>
            <option value="otro">Otro</option>
          </select>
        </div>

        <div class="form__group">
          <fieldset>
            <legend>Acuerdos legales</legend>
            <div class="form__check-group">
              <label>
                <input type="checkbox" id="terminos" required />
                Acepto los términos
              </label>
            </div>
          </fieldset>
        </div>

        <button type="submit" class="btn-submit">
          Crear cuenta
        </button>

      </form>

      <p class="card__footer">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
